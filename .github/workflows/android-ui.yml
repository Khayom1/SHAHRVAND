name: SHAHRVAND v1 Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
      - "optimization/**"
      - "main"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shahrvand-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "8.13"
      - name: Verify consent-scoped tracking permissions
        run: |
          grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.health.READ_STEPS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="location"' app/src/main/AndroidManifest.xml
          ! grep -E 'ACCESS_BACKGROUND_LOCATION|RECORD_AUDIO' app/src/main/AndroidManifest.xml
      - name: Run unit tests and assemble optimized ARM64 APK and Play App Bundle
        run: gradle :app:testPlayDebugUnitTest :app:assembleDirectOptimized :app:bundlePlayRelease
      - name: Report optimized APK size
        run: |
          echo "### Optimized ARM64 APK" >> "$GITHUB_STEP_SUMMARY"
          du -h app/build/outputs/apk/direct/optimized/app-direct-optimized.apk | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Multi-ABI Google Play App Bundle" >> "$GITHUB_STEP_SUMMARY"
          du -h app/build/outputs/bundle/playRelease/app-play-release.aab | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload optimized ARM64 installable APK
        uses: actions/upload-artifact@v7
        with:
          name: shahrvand-v1-optimized-arm64-apk
          path: app/build/outputs/apk/direct/optimized/app-direct-optimized.apk
          if-no-files-found: error
      - name: Upload multi-ABI release AAB for Google Play
        uses: actions/upload-artifact@v7
        with:
          name: shahrvand-v1-release-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
