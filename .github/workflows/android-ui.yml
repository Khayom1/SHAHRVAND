name: SHAHRVAND v1 Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
      - "optimization/**"
      - "main"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shahrvand-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "8.13"
      - name: Verify consent-scoped tracking permissions
        run: |
          grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.health.READ_STEPS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="location"' app/src/main/AndroidManifest.xml
          ! grep -E 'ACCESS_BACKGROUND_LOCATION|RECORD_AUDIO' app/src/main/AndroidManifest.xml
      - name: Run unit tests and assemble optimized APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleOptimized :app:assembleRelease :app:bundleRelease
      - name: Report APK sizes
        run: |
          echo "### Optimized APK sizes" >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/optimized/*.apk; do
            [ -f "$apk" ] && du -h "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload optimized installable APKs
        uses: actions/upload-artifact@v7
        with:
          name: shahrvand-v1-optimized-apks
          path: app/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
      - name: Upload debug APKs (all ABIs)
        uses: actions/upload-artifact@v7
        with:
          name: shahrvand-v1-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release AAB for Google Play
        uses: actions/upload-artifact@v7
        with:
          name: shahrvand-v1-release-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload unsigned release APKs
        uses: actions/upload-artifact@v7
        with:
          name: shahrvand-v1-release-unsigned-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
