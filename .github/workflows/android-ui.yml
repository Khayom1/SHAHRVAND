name: SHAHRVAND v1 Android CI

on:
  push:
    branches:
      - "release/**"
      - "main"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "8.13"
      - name: Verify child-safe manifest permissions
        run: |
          ! grep -E 'ACCESS_(FINE|COARSE)_LOCATION|CAMERA|RECORD_AUDIO|FOREGROUND_SERVICE_LOCATION' app/src/main/AndroidManifest.xml
      - name: Run unit tests and assemble APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: shahrvand-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: shahrvand-v1-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
