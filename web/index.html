function setAvatar(file){if(!file)return;if(file.size>1024*1024){alert(s.lang==="ru"?"Выберите фото до 1 МБ":s.lang==="en"?"Choose an image under 1 MB":"Акс бояд аз 1 МБ хурд бошад.");return}let reader=new FileReader();reader.onload=function(){s.photo=reader.result;save();let box=document.getElementById("avatarPreview");if(box)box.innerHTML='<img src="'+s.photo+'" alt="">'};reader.readAsDataURL(file)}
function register(e){e.preventDefault();let f=document.getElementById("first").value.trim(),l=document.getElementById("last").value.trim(),a=Number(document.getElementById("age").value);let er=document.getElementById("regerr");if(!f||!l){er.textContent=t("nameErr");return}if(!Number.isInteger(a)||a<7||a>120){er.textContent=t("ageErr");return}s.profile={first:f,last:l,age:a};s.tab="home";save();render()}
function go(tab){s.tab=tab;save();render()}
function home(){let m=missions.find(x=>s.submitted.indexOf(x.id)<0)||missions[0];shell(top(t("home"),t("test"))+'<section class="hero"><small>'+esc(t("progress"))+'</small><div class="score">'+s.xp.toLocaleString("en-US")+' XP</div><small>'+esc(t("level"))+' 3 • Амалгар</small><div style="height:7px;background:#315772;border-radius:8px;margin-top:11px"><div style="height:100%;width:65%;background:var(--g);border-radius:8px"></div></div></section><div class="stats"><div class="stat"><b>12</b><small>'+esc(t("done"))+'</small></div><div class="stat"><b>'+s.submitted.length+'</b><small>'+esc(t("pending"))+'</small></div><div class="stat"><b>'+Math.max(0,4-s.submitted.length)+'</b><small>'+esc(t("left"))+'</small></div></div><h2>'+esc(t("hello"))+', '+esc(s.profile.first)+'!</h2><div class="section"><h2>'+esc(t("todayMission"))+'</h2><button class="link" onclick="go(\'missions\')">'+esc(t("view"))+' →</button></div>'+missionCard(m)+'<div class="card mission" style="background:#fff8e8"><div class="mi">🏆</div><div class="grow"><b>'+esc(t("citizen"))+'</b><small>'+esc(t("citizenNote"))+'</small></div></div><div class="section"><h2>'+esc(t("recent"))+'</h2></div>'+(s.submitted.length?s.submitted.map(function(id){let x=missions.find(y=>y.id===id);return x?'<div class="card mission"><div class="mi">'+x.icon+'</div><div class="grow"><b>'+esc(t(x.title))+'</b><small>'+esc(t("status"))+'</small></div></div>':''}).join(""):'<p class="muted">'+esc(t("empty"))+'</p>')+'<p class="notice">'+esc(t("notConnected"))+'</p>')}
function missionDescription(id){const d={run:{tg:"Масофаи 2 километрро бо суръати мувофиқ тай кунед. Бехатариро ба назар гиред.",ru:"Пробегите 2 километра в комфортном темпе. Соблюдайте безопасность.",en:"Run 2 kilometres at a comfortable pace. Prioritise safety."},clean:{tg:"Қисми бехатари кӯча ё назди маҳалли истиқоматро тоза кунед.",ru:"Уберите безопасный участок улицы или территорию рядом с домом.",en:"Clean a safe section of a street or nearby public area."},tree:{tg:"Дарахтро дар ҷойи мувофиқ ва бо иҷозати зарурӣ шинонед.",ru:"Посадите дерево в подходящем месте с необходимым разрешением.",en:"Plant a tree in a suitable place with any required permission."},read:{tg:"30 дақиқа мавзӯи муфидро хонед ва хулоса нависед.",ru:"Читайте полезную тему 30 минут и запишите вывод.",en:"Read a useful topic for 30 minutes and write a short takeaway."}};return d[id][s.lang]||d[id].tg}
function missionCard(m){return '<div class="card mission" onclick="openMission(\''+m.id+'\')"><div class="mi">'+m.icon+'</div><div class="grow"><b>'+esc(t(m.title))+'</b><small>'+esc(t(m.cat))+' • '+esc(m.dur)+'</small></div><div class="xp">+'+m.xp+' XP</div></div>'}
function missionsPage(){shell(top(t("missions"),t("available"))+'<div class="card mission" onclick="personalForm()"><div class="mi">＋</div><div class="grow"><b>'+esc(t("personal"))+'</b><small>'+esc(t("personalNote"))+'</small></div></div>'+missions.map(missionCard).join("")+'<p class="notice">'+esc(t("notConnected"))+'</p>')}
function openMission(id){let m=missions.find(x=>x.id===id);if(!m)return;s.tab="missions";save();shell(top(t("missions"),"")+'<button class="link" onclick="missionsPage()">← '+esc(t("missions"))+'</button><div class="hero"><div style="font-size:36px">'+m.icon+'</div><h2>'+esc(t(m.title))+'</h2><div class="muted">'+esc(t(m.cat))+' • '+m.xp+' XP</div></div><div class="card"><p>'+esc(missionDescription(id))+'</p><div class="summary"><div class="mini"><small>'+esc(t("duration"))+'</small><b>'+esc(m.dur)+'</b></div><div class="mini"><small>'+esc(t("reward"))+'</small><b>'+m.xp+' XP</b></div></div><label class="label">'+esc(t("proof"))+'</label><input class="field" type="file" id="proof" accept="image/*,video/*" '+(s.submitted.indexOf(id)>=0?"disabled":"")+'>'+(s.submitted.indexOf(id)>=0?'<p class="muted">'+esc(t("already"))+'</p>':'<button class="btn primary full" style="margin-top:12px" onclick="submitMission(\''+id+'\')">'+esc(t("sendReview"))+'</button>')+'<div id="prooferr" class="error"></div></div><p class="notice">'+esc(t("notConnected"))+'</p>')}
function submitMission(id){let file=document.getElementById("proof").files[0];if(!file){document.getElementById("prooferr").textContent=t("noFile");return}if(s.submitted.indexOf(id)<0)s.submitted.push(id);save();openMission(id);let e=document.getElementById("prooferr");if(e)e.textContent=t("submitted")}
function personalForm(){showModal('<h2>'+esc(t("personal"))+'</h2><label class="label">'+esc(t("title"))+'</label><input id="ptitle" class="field"><label class="label">'+esc(t("desc"))+'</label><textarea id="pdesc" class="field" rows="4"></textarea><div class="actions"><button class="btn secondary" onclick="closeModal()">'+esc(t("cancel"))+'</button><button class="btn primary" onclick="savePersonal()">'+esc(t("send"))+'</button></div>')}
function savePersonal(){let title=document.getElementById("ptitle").value.trim(),desc=document.getElementById("pdesc").value.trim();if(!title||!desc)return;s.personal.unshift({title:title,desc:desc});save();closeModal();missionsPage()}
function ranking(){let p=periods[s.period];let html=top(t("ranking"),t("top30"))+'<div class="tabs">'+periods.map(function(x,i){return '<button class="tab '+(i===s.period?"active":"")+'" onclick="setPeriod('+i+')">'+esc(t(x.key))+'</button>'}).join("")+'</div><div class="summary"><div class="mini"><small>'+esc(t("periodXP"))+'</small><b>'+p.xp.toLocaleString("en-US")+'</b></div><div class="mini"><small>'+esc(t("place"))+'</small><b>#'+p.rank+'</b></div><div class="mini"><small>'+esc(t("lifetime"))+'</small><b>'+s.xp.toLocaleString("en-US")+'</b></div></div><p class="notice">'+esc(t("rankHint"))+'</p>';for(let i=0;i<30;i++){let score=p.top-i*p.step;html+='<div class="leader"><div class="rank">'+(i+1)+'</div><div class="lname"><b>'+esc(people[i])+'</b><small>'+(i===0?esc(t("active")):esc(t("participant")))+'</small></div><div class="lxp">'+score.toLocaleString("en-US")+' XP</div></div>'}html+='<div class="self"><div><small>'+esc(t("place"))+' • '+esc(t(p.key))+'</small><b>#'+p.rank+' · '+esc(s.profile.first)+' '+esc(s.profile.last)+'</b></div><strong>'+p.xp.toLocaleString("en-US")+' XP</strong></div><p class="notice">'+esc(t("notConnected"))+'</p>';shell(html)}
function setPeriod(i){s.period=i;save();ranking()}
function profile(){let bEarn=badges.filter(x=>x.earned),bLock=badges.filter(x=>!x.earned);let h=top(t("profile"),"")+'<section class="hero"><div class="profile"><div class="avatar">'+(s.photo?'<img src="'+s.photo+'" alt="">':'👤')+'</div><div><b style="font-size:18px">'+esc(s.profile.first+' '+s.profile.last)+'</b><div><small>'+s.profile.age+' '+esc(t("ageShort"))+' • '+esc(t("level"))+' 3</small></div><small style="color:#e7d4a8">Амалгар</small></div></div><div class="summary"><div class="mini"><small>'+esc(t("lifetime"))+'</small><b>'+s.xp.toLocaleString("en-US")+'</b></div><div class="mini"><small>'+esc(t("place"))+'</small><b>#147</b></div></div></section><button class="btn secondary" onclick="settings()">⚙ '+esc(t("settings"))+'</button> <button class="btn secondary" onclick="editProfile()">'+esc(t("edit"))+'</button><div class="section"><h2>'+esc(t("titles"))+'</h2></div><small class="muted">'+esc(t("earned"))+'</small><div class="badges">'+bEarn.map(badgeCard).join("")+'</div><small class="muted" style="display:block;margin-top:15px">'+esc(t("locked"))+'</small><div class="badges">'+bLock.map(badgeCard).join("")+'</div><div class="section"><h2>'+esc(t("history"))+'</h2></div><div class="card"><div class="settingsrow"><b>'+esc(t("done"))+'</b><b>12</b></div><div class="settingsrow"><b>'+esc(t("pending"))+'</b><b>'+s.submitted.length+'</b></div>'+s.personal.map(function(x){return '<div class="settingsrow"><b>'+esc(x.title)+'<small>'+esc(t("status"))+'</small></b>⌛</div>'}).join("")+'</div><p class="notice">'+esc(t("notConnected"))+'</p>';shell(h)}
function badgeCard(b){let nm=titleNames[b.name][s.lang]||titleNames[b.name].tg;return '<button class="badge '+(b.earned?"":"locked")+'" onclick="badgeInfo(\''+b.id+'\')"><span>'+b.icon+'</span><b>'+esc(nm)+'</b><small>'+esc(t(b.earned?"earned":"locked"))+'</small></button>'}
function badgeInfo(id){let b=badges.find(x=>x.id===id),nm=titleNames[b.name][s.lang]||titleNames[b.name].tg;showModal('<div style="font-size:38px">'+b.icon+'</div><h2>'+esc(nm)+'</h2><p>'+esc(t("how"))+':</p><p>'+esc(t(b.rule))+'</p><small class="muted">'+esc(t(b.earned?"earnedTitle":"lockedTitle"))+'</small><div class="actions"><button class="btn primary full" onclick="closeModal()">'+esc(t("close"))+'</button></div>')}
function settings(){showModal('<h2>'+esc(t("settings"))+'</h2><div class="settingsrow"><div><b>'+esc(t("language"))+'</b><small>Тоҷикӣ / Русский / English</small></div><select class="lang" onchange="changeLang(this.value)"><option value="tg" '+(s.lang==="tg"?"selected":"") +'>Тоҷикӣ</option><option value="ru" '+(s.lang==="ru"?"selected":"") +'>Русский</option><option value="en" '+(s.lang==="en"?"selected":"") +'>English</option></select></div><div class="settingsrow"><div><b>'+esc(t("edit"))+'</b><small>'+esc(t("first"))+', '+esc(t("last"))+', '+esc(t("age"))+'</small></div><button class="btn secondary" onclick="closeModal();editProfile()">'+esc(t("view"))+'</button></div><div class="settingsrow"><div><b>'+esc(t("privacy"))+'</b><small>'+esc(t("settingsNote"))+'</small></div>🔒</div><button class="btn danger full" style="margin-top:15px" onclick="resetData()">'+esc(t("reset"))+'</button><p class="notice">'+esc(t("settingsNote"))+'</p>')}
function changeLang(v){s.lang=v;save();settings()}
function editProfile(){showModal('<h2>'+esc(t("edit"))+'</h2><label class="label">'+esc(t("first"))+'</label><input class="field" id="ef" value="'+esc(s.profile.first)+'" maxlength="40"><label class="label">'+esc(t("last"))+'</label><input class="field" id="el" value="'+esc(s.profile.last)+'" maxlength="40"><label class="label">'+esc(t("age"))+'</label><input class="field" id="ea" inputmode="numeric" maxlength="3" value="'+s.profile.age+'" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')"><div id="ee" class="error"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">'+esc(t("cancel"))+'</button><button class="btn primary" onclick="saveEdit()">'+esc(t("save"))+'</button></div>')}
function saveEdit(){let f=document.getElementById("ef").value.trim(),l=document.getElementById("el").value.trim(),a=Number(document.getElementById("ea").value),e=document.getElementById("ee");if(!f||!l){e.textContent=t("nameErr");return}if(!Number.isInteger(a)||a<7||a>120){e.textContent=t("ageErr");return}s.profile={first:f,last:l,age:a};save();closeModal();profile()}
function resetData(){if(!confirm(t("resetAsk")))return;localStorage.removeItem(K);s=Object.assign({},base);closeModal();registration()}
function showModal(x){document.getElementById("modal").innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">'+x+'</div></div>'}
function closeModal(){document.getElementById("modal").innerHTML=""}
function render(){if(!s.profile){registration();return}if(s.tab==="home")home();else if(s.tab==="missions")missionsPage();else if(s.tab==="ranking")ranking();else profile()}
window.addEventListener("storage",function(e){if(e.key===K){s=load();render()}});
render();
</script><!-- GitHub Pages preview deployment trigger -->
</body></html>
